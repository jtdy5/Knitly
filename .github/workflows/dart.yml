name: iOS-ipa-build
on: 
  workflow_dispatch:

# CRITICAL: Gives the runner permission to create a release and upload the IPA file
permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Removed architecture: x64 to let it use native ARM64 on newer macOS runners
          # Tip: If your project relies on an older Flutter version, add:
          # flutter-version: '3.x.x' 

      - run: flutter pub get 

      # Safely cleans and updates CocoaPods dependencies inside the iOS environment
      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
