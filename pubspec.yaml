name: knitly
description: A new Flutter project for knitting tracking.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'
  flutter: '>=3.13.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core App Dependencies
  provider: ^6.1.5+1              # For state management
  shared_preferences: ^2.5.5    # For saving data locally
  uuid: ^4.5.3                  # For generating unique IDs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

- name: Set Default Scheme
  run: |
    if ! xcodebuild -list -json > /dev/null 2>&1; then
      echo "No Xcode project found. Skipping build."
      exit 0
    fi
    scheme_list=$(xcodebuild -list -json | tr -d "\n")
    default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
    echo $default | cat >default
    echo Using default scheme: $default